# Local development stack. Not a production deployment.
#
# The credentials below are throwaway defaults for a container that only listens
# on your own machine. Override them with a .env file next to this one (Compose
# reads it automatically) or with your own environment variables. An earlier
# version of this file carried the real hosting credentials in a commented-out
# block; those are gone from the file, but they must still be rotated on the
# server, because they are in the git history.
services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-typhon_cath_crm}
      DB_USER: ${DB_USER:-crm_user}
      DB_PASS: ${DB_PASS:-devonly_change_me}
      # Used only by the integration suite (tests/IntegrationTestCase.php),
      # which drops and rebuilds its own database on every run. DB_USER above
      # is scoped to the application's database and cannot CREATE DATABASE —
      # correctly so — which is why the tests need their own credentials rather
      # than a privilege grant to the app user.
      DB_TEST_USER: root
      DB_TEST_PASS: ${MYSQL_ROOT_PASSWORD:-devonly_root}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    # Published so a DB client (TablePlus/DBeaver) can connect on 127.0.0.1 —
    # which the README has always told people to do, even though this mapping
    # did not previously exist. If a local MySQL already owns 3306, set
    # DB_HOST_PORT=3307 in .env instead of editing this file.
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devonly_root}
      MYSQL_DATABASE: ${DB_NAME:-typhon_cath_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASS:-devonly_change_me}
    volumes:
      - db_data:/var/lib/mysql
      # Applied in filename order, once, on an empty volume. indexes.sql must
      # come last: it adds every secondary and FULLTEXT index. Without it, RFQ,
      # account and campaign search fail outright with "Can't find FULLTEXT
      # index matching the column list".
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./src/database/indexes.sql:/docker-entrypoint-initdb.d/03-indexes.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development convenience only. Behind a profile so a plain `docker compose up`
  # never exposes an unauthenticated DB console.
  #   docker compose --profile tools up
  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8081:8080"

volumes:
  db_data:
